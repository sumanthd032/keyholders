# Single-node HydraDB for local development, backed by MinIO.
#
# HydraDB is an object-store-native database: SlateDB keeps its WAL, manifests and SSTs in the
# object store, and coordination (writer leases, manifest rotation, compaction bookkeeping) needs
# conditional writes to be correct. The store therefore has to support compare-and-swap puts.
#
# The obvious local configuration, CLOUD_PROVIDER=local with a bind mounted directory, does not.
# object_store's LocalFileSystem returns NotImplemented for `put_opts` with `PutMode::Update`, so a
# local store works only until the first manifest rotation, after which every write fails with
# Neo.DatabaseError.General.UnknownError and reads carry on working. That failure is silent from the
# client side and permanent for the store, which is why this file runs MinIO instead: it speaks
# S3 conditional puts, which is what the engine is designed against.
#
# Four settings are load bearing, and each one produces a confusing failure if it is missing:
#
#   user: "1000:1000"      The image runs as UID/GID 10001 while ./hydradb-data is owned by the host
#                          user. Without this the container cannot write its cache directory.
#   RUST_MIN_STACK         graph-node's async query futures exceed the default thread stack. Without
#                          this the node builds, answers /readyz, then aborts on the first query.
#   AWS_ALLOW_HTTP         MinIO is served over plain HTTP here. object_store refuses a non-TLS
#                          endpoint unless this is set, and the resulting error names the URL scheme
#                          rather than the setting.
#   AWS_CONDITIONAL_PUT    Selects the compare-and-swap mechanism. `etag` uses If-Match, which is
#                          the whole reason for running MinIO rather than a local directory.
#
# GRAPH_ALLOW_PLAINTEXT is set because TLS is required by default in deployed environments; this is
# a local development node only.

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: keyholders-minio
    command: server /data --address ":9000" --console-address ":9001"
    user: "1000:1000"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - ./hydradb-data/minio:/data
    environment:
      MINIO_ROOT_USER: keyholders
      MINIO_ROOT_PASSWORD: keyholders-dev-secret
      MINIO_UPDATE: "off"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One shot bucket creation. HydraDB does not create its own bucket, and the failure when it is
  # missing surfaces during startup as a generic object store error.
  minio-init:
    image: quay.io/minio/minio:latest
    container_name: keyholders-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 keyholders keyholders-dev-secret
        mc mb --ignore-existing local/hydradb
    restart: "no"

  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: keyholders-hydradb
    user: "1000:1000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "7687:7687" # Bolt  — Neo4j-driver-compatible
      - "8443:8443" # HTTP  — JSON / NDJSON query API
      - "9090:9090" # Admin — /readyz, /metrics
    volumes:
      - ./hydradb-data:/data
    environment:
      CLOUD_PROVIDER: aws
      AWS_BUCKET_NAME: hydradb
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: keyholders
      AWS_SECRET_ACCESS_KEY: keyholders-dev-secret
      AWS_ENDPOINT: http://minio:9000
      AWS_ALLOW_HTTP: "true"
      AWS_CONDITIONAL_PUT: etag
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    restart: unless-stopped
